apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: invoice-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/suri341/invoice-generation-app
    targetRevision: HEAD
    path: invoice-app
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: ingress.certificateArn
          value: ACM_CERT_ARN_PLACEHOLDER

  destination:
    server: https://kubernetes.default.svc
    namespace: invoice-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
