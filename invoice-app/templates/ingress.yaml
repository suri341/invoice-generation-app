{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: invoice-app
  namespace: {{ .Values.namespace }}
  annotations:
    {{- if .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn | quote }}
    {{- end }}
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: invoice-backend
                port:
                  number: {{ .Values.service.backendPort }}
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: invoice-backend
                port:
                  number: {{ .Values.service.backendPort }}
          - path: /redoc
            pathType: Prefix
            backend:
              service:
                name: invoice-backend
                port:
                  number: {{ .Values.service.backendPort }}
          - path: /openapi.json
            pathType: Prefix
            backend:
              service:
                name: invoice-backend
                port:
                  number: {{ .Values.service.backendPort }}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: invoice-backend
                port:
                  number: {{ .Values.service.backendPort }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: invoice-frontend
                port:
                  number: {{ .Values.service.frontendPort }}
{{- end }}
