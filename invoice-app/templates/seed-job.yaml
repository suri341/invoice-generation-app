{{- if .Values.seed.enabled }}
# seed_database() is idempotent, so re-running on upgrade is safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: invoice-seed
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: invoice-seed
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          command:
            - /bin/sh
            - -c
            - until pg_isready -h invoice-postgres -p {{ .Values.service.postgresPort }} -U {{ .Values.postgres.user }}; do echo waiting for postgres; sleep 2; done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: invoice-secrets
                  key: postgres-password
      containers:
        - name: seed
          image: docker.io/{{ .Values.image.username }}/invoice-backend:{{ .Values.image.backendTag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "-m", "app.seed_data"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: invoice-secrets
                  key: database-url
{{- end }}
